<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>CGP Launcher Rebuilt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="overflow-hidden bg-canvas text-ink">
  <header class="titlebar app-drag flex h-10 items-center justify-between border-b border-line bg-titlebar pl-4">
    <span class="flex items-center gap-2 text-[14px] font-semibold"><img class="size-4 object-contain grayscale" src="../assets/logo.png" alt="">CGP Launcher</span>
    <div class="app-no-drag flex h-full">
      <button data-window="minimize" aria-label="最小化"><i data-icon="minimize"></i></button>
      <button data-window="maximize" aria-label="最大化・復元"><i data-icon="maximize"></i></button>
      <button data-window="close" aria-label="閉じる"><i data-icon="close"></i></button>
    </div>
  </header>
  <div id="app-layout" class="launcher-shell relative grid h-[calc(100vh-40px)]" data-sidebar-collapsed="false">
    <button id="sidebar-toggle" class="sidebar-toggle icon-button absolute top-6 z-20 bg-side" title="サイドバーを非表示" aria-label="サイドバーを非表示" aria-controls="sidebar" aria-expanded="true"><i data-icon="sidebar-close"></i></button>
    <div class="min-w-0 overflow-hidden">
    <aside id="sidebar" class="launcher-sidebar flex h-full min-h-0 flex-col border-r border-line bg-side">
      <div class="shrink-0 px-4 pt-5 pb-4">
        <div class="mb-4 flex h-10 items-center gap-3">
          <img class="size-8 object-contain" src="../assets/logo.png" alt="CGP">
          <div class="brand-name min-w-0 flex-1">CGP Launcher</div>
          <span class="size-8 shrink-0" aria-hidden="true"></span>
        </div>
        <label class="search-field">
          <i data-icon="search"></i><input id="search" class="min-w-0 w-full border-0 bg-transparent text-sm text-ink outline-none" placeholder="ゲームを検索" aria-label="ゲーム・作者・タグを検索" autocomplete="off">
          <button id="filters-toggle" type="button" class="icon-button size-6!" title="絞り込み・並び替え" aria-label="絞り込み・並び替え"><i data-icon="filter"></i></button>
        </label>
      </div>
      <div class="sidebar-tools">
        <div class="view-switch" role="group" aria-label="表示形式">
          <button id="grid-view" class="view-button" aria-label="グリッド表示" title="グリッド表示"><i data-icon="grid"></i></button>
          <button id="list-view" class="view-button" aria-label="リスト表示" title="リスト表示"><i data-icon="list"></i></button>
        </div>
        <button id="sync" class="icon-button ml-auto" aria-label="ゲームリストを同期" title="再読み込み"><i data-icon="refresh"></i></button>
        <button id="settings" class="icon-button" aria-label="設定" title="設定"><i data-icon="settings"></i></button>
      </div>
      <div id="filter-summary" class="flex shrink-0 items-center justify-between gap-2 border-b border-line px-4 py-2 text-xs text-muted" hidden><span id="filter-label" class="truncate"></span><button id="reset-filter" class="text-accent">解除</button></div>
      <div id="game-list" class="min-h-0 flex-1 space-y-1 overflow-y-auto px-3 py-3" aria-label="ゲーム一覧"></div>
      <p id="sidebar-empty" class="px-4 py-5 text-sm text-muted" hidden>ゲームが見つかりません。</p>
    </aside>
    </div>
    <main id="main" class="min-w-0 overflow-y-auto bg-canvas">
      <section id="detail-screen"></section>
      <section id="library-screen" class="library-screen" hidden>
        <div id="game-grid" class="grid grid-cols-4 gap-5 max-[1250px]:grid-cols-3 max-[1050px]:grid-cols-2"></div>
      </section>
      <div id="empty" class="px-6 py-16 text-center text-muted" hidden><i data-icon="search"></i><p>ゲームが見つかりません</p></div>
    </main>
  </div>
  <dialog id="web-modal" class="web-dialog" aria-labelledby="web-title">
    <div class="flex h-full flex-col">
      <header class="web-toolbar">
        <h2 id="web-title" class="min-w-0 flex-1 truncate text-[16px] font-medium"></h2>
        <div class="flex items-center gap-2">
          <div class="volume-control">
            <button id="web-mute" type="button" class="icon-button" aria-label="ミュート" aria-pressed="false"><i data-icon="volume"></i></button>
            <input id="web-volume" class="volume-slider" type="range" min="0" max="100" step="1" value="100" aria-label="ゲームの音量" aria-valuetext="100%">
            <output id="web-volume-value" for="web-volume" class="w-10 text-right text-xs tabular-nums text-muted">100%</output>
          </div>
          <button id="web-back" class="icon-button" title="戻る" aria-label="前のページ" hidden><i data-icon="back"></i></button>
          <button id="web-forward" class="icon-button" title="進む" aria-label="次のページ" hidden><i data-icon="forward"></i></button>
          <button id="web-reload" class="icon-button" title="再読み込み" aria-label="ページを再読み込み"><i data-icon="refresh"></i></button>
          <button id="web-external" class="icon-button" title="ブラウザで開く" aria-label="ブラウザで開く"><i data-icon="external"></i></button>
          <button id="web-exit" class="icon-button" title="閉じる" aria-label="ゲーム画面を閉じる"><i data-icon="close"></i></button>
        </div>
      </header>
      <div id="web-error" class="shrink-0 px-4 py-2 text-sm text-danger" role="alert" hidden></div>
      <div id="web-host" class="min-h-0 flex-1 bg-[#e4ecf5]"></div>
    </div>
  </dialog>
  <dialog id="filters-dialog" aria-labelledby="filters-title">
    <div class="modal-heading flex items-center justify-between border-b border-line px-7 py-5"><h2 id="filters-title">絞り込み・並び替え</h2><button class="icon-button" id="filters-close" aria-label="閉じる"><i data-icon="close"></i></button></div>
    <div class="modal-body grid grid-cols-2 gap-5 px-7 py-6">
      <label>表示範囲<select id="scope"><option value="all">すべてのゲーム</option><option value="installed">インストール済み</option><option value="favorites">お気に入り</option><option value="recent">最近プレイしたゲーム</option></select></label>
      <label>配布形式<select id="platform-filter"><option value="all">すべて</option><option value="browser">Unity Room</option><option value="desktop">Windows</option></select></label>
      <label>タグ<select id="tag-filter"><option value="">すべてのタグ</option></select></label>
      <label>並び替え<select id="sort"><option value="name">タイトル順</option><option value="recent">最近プレイした順</option><option value="author">作者順</option></select></label>
    </div>
    <div class="flex justify-end border-t border-line px-7 py-4"><button id="filters-reset" class="secondary">条件をリセット</button></div>
  </dialog>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form" class="flex max-h-[calc(100vh-80px)] flex-col">
      <div class="modal-heading flex shrink-0 items-center justify-between border-b border-line px-6 py-5">
        <h2 id="settings-title">設定</h2><button type="button" class="icon-button close-dialog" aria-label="設定を閉じる"><i data-icon="close"></i></button>
      </div>
      <div class="modal-body settings-body min-h-0 overflow-y-auto px-6">
        <section aria-labelledby="app-update-title">
          <h3 id="app-update-title" class="settings-heading"><i data-icon="download"></i>アップデート</h3>
          <div class="flex items-center justify-between gap-3"><span id="app-version" class="text-sm text-muted"></span><button id="update-check" type="button" class="secondary text-sm!">更新を確認</button></div>
          <p id="update-status" class="mt-3! mb-0! text-sm leading-relaxed text-muted" role="status" aria-live="polite"></p>
          <progress id="update-progress" class="mt-3 h-1.5 w-full overflow-hidden rounded" max="100" value="0" aria-label="ランチャー更新のダウンロード進捗" hidden></progress>
          <button id="update-install-settings" type="button" class="primary mt-3" hidden>再起動して更新</button>
          <label class="checkbox"><span>自動アップデート</span><input id="auto-update" type="checkbox" title="終了時に適用"></label>
        </section>
        <section>
          <h3 class="settings-heading"><i data-icon="globe"></i>ゲーム一覧</h3>
          <label>カタログURL<input id="catalog-url" type="url" required spellcheck="false"></label>
          <label class="checkbox"><span>自動同期</span><input id="auto-sync" type="checkbox" title="起動時・1分ごとに同期"></label>
        </section>
        <section>
          <h3 class="settings-heading"><i data-icon="folder"></i>ダウンロード</h3>
          <label for="download-dir">保存先</label>
          <div class="mt-2 flex items-center gap-2">
            <input id="download-dir" class="mt-0! min-w-0" placeholder="デフォルトフォルダを使用" readonly aria-label="ダウンロードフォルダ">
            <button type="button" id="choose-folder" class="secondary shrink-0">変更</button>
            <button type="button" id="default-folder" class="icon-button" aria-label="標準の保存先に戻す" title="標準に戻す"><i data-icon="reset"></i></button>
          </div>
          <button type="button" id="import-legacy" class="text-button mt-2 text-xs">旧ランチャーのゲームを再検出</button>
        </section>
        <section>
          <h3 class="settings-heading"><i data-icon="palette"></i>外観</h3>
          <label>テーマ<select id="theme"><option value="dark">ダーク</option><option value="light">ライト</option><option value="system">システム</option></select></label>
        </section>
        <p id="settings-error" class="m-0! text-sm text-danger" role="alert"></p>
      </div>
      <div class="modal-footer flex shrink-0 items-center justify-between gap-4 border-t border-line px-6 py-4">
        <button type="button" id="reset-settings" class="text-button inline-flex items-center gap-2"><i data-icon="reset"></i>リセット</button>
        <div class="flex items-center gap-5"><button type="button" class="text-button close-dialog">キャンセル</button><button type="submit" class="primary">保存</button></div>
      </div>
    </form>
  </dialog>
  <dialog id="choice-dialog" aria-labelledby="choice-title"><div class="modal-heading flex items-center justify-between border-b border-line px-7 py-[25px]"><h2 id="choice-title"></h2><button class="icon-button" id="choice-close" aria-label="閉じる"><i data-icon="close"></i></button></div><div id="choice-body" class="modal-body px-7 py-6"></div></dialog>

  <section id="update-banner" class="fixed right-6 bottom-6 z-30 w-[420px] rounded-xl border border-blue-400/30 bg-side p-4 shadow-dialog" aria-label="ランチャーの更新" hidden>
    <div class="flex items-start gap-3"><i class="mt-0.5 text-blue-400" data-icon="download"></i><div class="min-w-0 flex-1"><p id="update-banner-title" class="m-0! text-sm font-semibold"></p><p id="update-banner-hint" class="mt-2! mb-0! text-xs leading-relaxed text-muted"></p></div></div>
    <progress id="update-banner-progress" class="mt-3 h-1.5 w-full overflow-hidden rounded" max="100" value="0" aria-label="ランチャー更新のダウンロード進捗" hidden></progress>
    <button id="update-install-banner" type="button" class="primary mt-3 w-full text-sm!" hidden>再起動して更新</button>
    <button id="update-retry" type="button" class="secondary mt-3 text-sm!" hidden>再試行</button>
  </section>
  <div id="toasts" class="fixed right-6 bottom-6 z-50 flex flex-col gap-2" aria-live="polite"></div>
  <script src="../node_modules/dompurify/dist/purify.min.js"></script><script src="app.js" type="module"></script>
</body>
</html>
